---
layout: default
body_class: blog-page
---

<section class="section blog-section">
  <div class="text">
    <article class="post">
      <h3>{{ page.title }}</h3>
      <p class="date">{{ page.date | date: "%B %d, %Y" }}</p>
      {{ content }}
    </article>
    <p class="back-link"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
  </div>
</section>
