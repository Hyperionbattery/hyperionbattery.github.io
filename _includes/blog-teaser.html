<section id="Blog" class="section">
  <div class="text">
      <h2>Blog</h2>
    <div class="posts">
      {% for post in site.posts limit:3 %}
        <article class="post">
          <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
          <p class="date">{{ post.date | date: "%B %d, %Y" }}</p>
          <p>{{ post.excerpt }}</p>
          <a class="read-more" href="{{ post.url }}">Read more &rarr;</a>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
